<style>
/* Farbwelt angelehnt an liberior24.de */
:root{
  --brown:#724A25; --brown-d:#5a3a1c; --brown-l:#8b6440;
  --cream:#F6EFE7; --cream2:#EFE4D7; --sand:#E6D6C3;
  --ink:#4A545B; --ink-d:#2f363b; --muted:#7b858c; --line:#E7DDD1; --white:#fff;
  --orange:#E0622A; --orange-l:#FBE4D8; --green:#5E7D5B; --green-l:#E4ECE1;
  --r:14px; --shadow:0 2px 12px rgba(90,58,28,.08);
}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--ink);font-family:Montserrat,system-ui,sans-serif;font-size:16.5px;-webkit-text-size-adjust:100%}
h1,h2,h3,h4{font-family:Inter,system-ui,sans-serif;color:var(--brown);margin:.2em 0 .5em;line-height:1.2;font-weight:800}
h1{font-size:1.85rem;letter-spacing:-.01em} h2{font-size:1.4rem} h3{font-size:1.12rem;font-weight:700}
a{color:var(--brown)}
button,input,select,textarea{font:inherit;color:inherit}
.eyebrow{font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--brown-l)}
.eyebrow.o{color:var(--orange)}

/* Kopf wie im Shop */
.topbar{background:#f4f4f4;font-size:.8rem;color:var(--ink);padding:calc(6px + env(safe-area-inset-top)) 16px 6px;display:flex;gap:18px;align-items:center;justify-content:center;flex-wrap:wrap;min-height:34px}
.topbar b{color:var(--brown)}
.topbar .tbtn{border:0;background:var(--brown);color:#fff;border-radius:999px;padding:3px 11px;font-weight:700;font-size:.75rem;cursor:pointer}
header.head{display:flex;align-items:center;gap:18px;padding:14px calc(20px + env(safe-area-inset-right)) 14px calc(20px + env(safe-area-inset-left));max-width:1240px;margin:0 auto}
.logo{font-family:Montserrat,sans-serif;font-weight:800;font-size:2.1rem;color:var(--brown);letter-spacing:-.04em;text-decoration:none;line-height:1}
.logo span{color:var(--orange)}
.search{flex:1;display:flex;align-items:center;background:#f1f1f1;border-radius:999px;padding:0 16px;min-height:44px;max-width:520px;margin-left:auto}
.search input{border:0;background:transparent;flex:1;outline:none;min-height:44px;text-align:center}
.search button{border:0;background:none;font-size:1.1rem;cursor:pointer}
nav.main{background:var(--brown)}
nav.main .in{max-width:1240px;margin:0 auto;display:flex;flex-wrap:wrap;padding:0 12px}
nav.main a{color:#fff;text-decoration:none;padding:14px 13px;font-size:.92rem;font-weight:500;border-bottom:3px solid transparent}
nav.main a.on{border-bottom-color:#fff;font-weight:700}
main{max-width:1240px;margin:0 auto;padding:22px calc(20px + env(safe-area-inset-right)) 120px calc(20px + env(safe-area-inset-left))}
nav.bottom{display:none}
footer{text-align:center;color:var(--muted);font-size:.8rem;padding:20px 0 30px}
@media (max-width:820px){
  .topbar{font-size:.74rem;gap:8px}
  header.head{padding:10px 14px;gap:10px}
  .logo{font-size:1.6rem}
  .search{display:none}
  nav.main{display:none}
  main{padding:14px 14px calc(100px + env(safe-area-inset-bottom))}
  nav.bottom{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--brown);padding:6px 4px calc(6px + env(safe-area-inset-bottom));overflow-x:auto;z-index:30;gap:2px}
  nav.bottom a{flex:1 0 66px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.68rem;font-weight:600;text-decoration:none;color:#f1e4d6;padding:6px 2px;border-radius:10px}
  nav.bottom a .ic{font-size:1.25rem}
  nav.bottom a.on{background:rgba(255,255,255,.16);color:#fff}
  h1{font-size:1.5rem}
}

/* Karten im liberior-Stil */
.card{background:var(--cream);border-radius:var(--r);padding:18px;margin-bottom:16px}
.card.w{background:#fff;border:1px solid var(--line)}
.bcard{border-radius:var(--r);overflow:hidden;background:var(--cream);box-shadow:var(--shadow);margin-bottom:16px;display:flex;flex-direction:column}
.bcard .hd{background:var(--brown);color:#fff;padding:11px 16px;display:flex;align-items:center;gap:10px;justify-content:space-between}
.bcard .hd b{font-family:Inter,sans-serif;font-weight:800;letter-spacing:.05em;text-transform:uppercase;font-size:.9rem}
.bcard .hd .pill{background:var(--orange);color:#fff;border-radius:999px;padding:3px 10px;font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.bcard .hd a{color:#fff;font-size:.82rem;font-weight:700;text-decoration:none;white-space:nowrap}
.bcard .bd{padding:18px;flex:1}
.oval{background:#efe2d2;border-radius:50%;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;font-size:3.2rem;overflow:hidden;background-size:cover;background-position:center}
.split{display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:center}
@media (max-width:520px){ .split{grid-template-columns:96px 1fr;gap:12px} .oval{font-size:2.3rem} }
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.grid2{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
@media (max-width:400px){ .grid2{grid-template-columns:1fr} }
.muted{color:var(--muted)} .small{font-size:.86rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:4px;border:0;background:var(--brown);color:#fff;font-weight:700;cursor:pointer;text-decoration:none;font-size:.95rem}
.btn:active{transform:scale(.98)}
.btn.sec{background:#fff;color:var(--brown);border:1.5px solid var(--brown)}
.btn.or{background:var(--orange)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.sm{min-height:38px;padding:0 13px;font-size:.88rem}
.btn[disabled]{opacity:.45}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
label.f{display:block;font-weight:700;font-size:.86rem;margin:12px 0 5px;color:var(--ink-d)}
input.i,select.i,textarea.i{width:100%;min-height:48px;padding:10px 13px;border:1.5px solid var(--line);border-radius:6px;background:#fff}
textarea.i{min-height:110px;resize:vertical}
input.i:focus,select.i:focus,textarea.i:focus{outline:2px solid var(--brown-l);border-color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{border:1.5px solid var(--sand);background:#fff;border-radius:999px;padding:8px 14px;font-weight:600;cursor:pointer;font-size:.88rem;color:var(--ink-d)}
.chip.on{background:var(--brown);border-color:var(--brown);color:#fff}
.link{display:flex;gap:14px;align-items:flex-start;padding:14px;border-radius:var(--r);border:1px solid var(--line);background:#fff;text-decoration:none;color:var(--ink)}
.link:hover{border-color:var(--brown)}
.link .em{font-size:1.6rem;line-height:1}
.link b{display:block;color:var(--brown);font-family:Inter,sans-serif}
.go{font-weight:700;color:var(--brown);font-size:.88rem;text-decoration:none}
.tag{display:inline-block;font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--green-l);color:#3c5a3a;margin:2px 4px 0 0}
.tag.o{background:var(--orange-l);color:#a2421a} .tag.b{background:var(--cream2);color:var(--brown)}

/* Begrüßung */
.hello{background:var(--cream);border-radius:var(--r);overflow:hidden;margin-bottom:18px;display:grid;grid-template-columns:1fr 260px}
.hello .tx{padding:26px}
.hello .tx h1{font-size:2rem;margin-bottom:.3em}
.hello .art{background:#efe2d2;display:flex;align-items:center;justify-content:center}
.hello .art svg{width:200px;height:200px}
@media (max-width:700px){ .hello{grid-template-columns:1fr} .hello .art{display:none} .hello .tx{padding:18px} .hello .tx h1{font-size:1.5rem} }
.care{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.care span{background:#fff;border-radius:999px;padding:7px 12px;font-size:.84rem;font-weight:600;color:var(--brown)}
.tipp{border-left:4px solid var(--orange);background:#fff;padding:14px 16px;border-radius:0 var(--r) var(--r) 0;margin-bottom:16px;box-shadow:var(--shadow)}

.proj{background:var(--cream);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column}
.proj .ph{aspect-ratio:4/3;background:#efe2d2 center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:2.6rem}
.proj .bd{padding:12px 14px}
.proj .bd b{font-family:Inter,sans-serif;color:var(--brown)}
table.t{width:100%;border-collapse:collapse;font-size:.9rem;background:#fff;border-radius:8px;overflow:hidden}
table.t th,table.t td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{font-size:.74rem;text-transform:uppercase;letter-spacing:.05em;color:var(--brown-l)}
.scroll{overflow-x:auto}
.result{font-size:1.55rem;font-family:Inter,sans-serif;font-weight:800;color:var(--brown)}
.counter{display:flex;align-items:center;gap:16px;justify-content:center;margin:10px 0}
.counter .n{font-family:Inter,sans-serif;font-weight:800;color:var(--brown);font-size:3.2rem;min-width:120px;text-align:center}
.counter button{width:76px;height:76px;border-radius:50%;border:0;font-size:2.1rem;font-weight:800;cursor:pointer}
.counter .p{background:var(--brown);color:#fff}.counter .m{background:#fff;color:var(--brown);border:2px solid var(--sand)}
.ai{background:#fff;border:1px dashed var(--brown-l);border-radius:var(--r);padding:14px;margin-top:12px}
.ai p{margin:.4em 0} .ai ul,.ai ol{margin:.3em 0;padding-left:1.3em}
.overlay{position:fixed;inset:0;background:rgba(47,30,14,.5);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:calc(20px + env(safe-area-inset-top)) 12px 40px}
.sheet{background:#fff;border-radius:var(--r);max-width:760px;width:100%;padding:20px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom));background:var(--ink-d);color:#fff;padding:12px 18px;border-radius:10px;z-index:80;font-weight:600;max-width:90vw}
.switch{display:flex;align-items:center;gap:12px;padding:12px;border-radius:8px;background:var(--cream);cursor:pointer}
.switch input{width:24px;height:24px;accent-color:var(--brown)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumbs div{position:relative}
.thumbs img{width:96px;height:96px;object-fit:cover;border-radius:10px;display:block}
.thumbs button{position:absolute;top:-6px;right:-6px;width:28px;height:28px;border-radius:50%;border:0;background:var(--ink-d);color:#fff;cursor:pointer}
.big img{width:100%;border-radius:10px;margin-bottom:8px}
details.lern{background:#fff;border:1px solid var(--line);border-radius:10px;padding:4px 14px;margin-bottom:10px}
details.lern summary{cursor:pointer;font-weight:700;padding:11px 0;list-style:none;color:var(--ink-d)}
details.lern summary::-webkit-details-marker{display:none}
details.lern summary::before{content:"＋ ";color:var(--orange);font-weight:800}
details.lern[open] summary::before{content:"－ "}
.note{background:var(--cream);border-radius:10px;padding:12px 14px;font-size:.9rem}
.month{scroll-margin-top:20px}
.month.now .hd{background:var(--orange)}
.idea{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--sand)}
.idea:last-child{border-bottom:0}
.idea .em{font-size:1.8rem;width:44px;height:44px;flex:none;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center}
.idea b{font-family:Inter,sans-serif;color:var(--ink-d)}
.pause{text-align:center}
.pause .big{font-size:4rem}
.timer{font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="topbar" id="topbar"></div>
<header class="head">
  <a class="logo" href="#start">maschen<span>zeit</span></a>
  <form class="search" id="hsearch"><input id="hq" placeholder="Anleitung suchen, z. B. Socken …" aria-label="Anleitung suchen"><button aria-label="Suchen">🔍</button></form>
</header>
<nav class="main"><div class="in" id="nav1"></div></nav>
<main id="main"></main>
<nav class="bottom" id="nav2"></nav>
<div id="ov"></div>

<script>
/* ================= Grundlagen ================= */
const ART = `<svg viewBox="0 0 200 200"><circle cx="92" cy="110" r="62" fill="#b7794a"/><g fill="none" stroke="#e9c9a4" stroke-width="4" stroke-linecap="round"><path d="M36 92c34-18 86-16 116 14"/><path d="M32 118c40-22 92-16 120 8"/><path d="M46 146c30-18 70-20 98-6"/><path d="M66 56c-12 34-8 86 26 114"/><path d="M104 50c-16 40-10 90 22 116"/></g><path d="M140 60 L184 18" stroke="#724A25" stroke-width="6" stroke-linecap="round"/><path d="M150 72 L190 40" stroke="#724A25" stroke-width="6" stroke-linecap="round"/><circle cx="186" cy="16" r="6" fill="#E0622A"/><circle cx="192" cy="38" r="6" fill="#E0622A"/><path d="M152 120c20 10 26 40 10 60" fill="none" stroke="#b7794a" stroke-width="4" stroke-linecap="round"/></svg>`;
const VIEWS = [
  ['start','🏡','Start'],
  ['saison','🍂','Jahreszeiten'],
  ['anleitungen','🔎','Anleitungen'],
  ['projekte','🧶','Projekte'],
  ['vorrat','🧺','Vorrat'],
  ['rechner','🧮','Umrechnen'],
  ['lernen','📖','Tipps & Lernen'],
  ['welt','🌍','Stricken weltweit'],
  ['wolle','🛒','Wolle kaufen'],
  ['upcycling','♻️','Upcycling'],
];
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const enc = encodeURIComponent;
const LS = { get(k,d){ try{ const v=localStorage.getItem('mz_'+k); return v==null?d:JSON.parse(v);}catch(e){return d;} }, set(k,v){ try{localStorage.setItem('mz_'+k,JSON.stringify(v));}catch(e){} } };
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2800);}
function md(txt){
  const lines = esc(txt).split('\n'); let out='', list=null;
  const inl = s => s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>');
  for (const l of lines){
    let m;
    if ((m=l.match(/^\s*[-*•]\s+(.*)/))){ if(list!=='ul'){ if(list) out+=`</${list}>`; out+='<ul>'; list='ul'; } out+=`<li>${inl(m[1])}</li>`; continue; }
    if ((m=l.match(/^\s*\d+[.)]\s+(.*)/))){ if(list!=='ol'){ if(list) out+=`</${list}>`; out+='<ol>'; list='ol'; } out+=`<li>${inl(m[1])}</li>`; continue; }
    if (list){ out+=`</${list}>`; list=null; }
    if ((m=l.match(/^#{1,4}\s+(.*)/))) { out+=`<h3>${inl(m[1])}</h3>`; continue; }
    if (l.trim()) out+=`<p>${inl(l)}</p>`;
  }
  if (list) out+=`</${list}>`;
  return out;
}
const dayNo = () => Math.floor((Date.now() - new Date(new Date().getFullYear(),0,0)) / 864e5);

/* ================= Inhalte ================= */
// Tipps (aus deutschen & internationalen Strick-Quellen, Ergonomie-Ratgebern, Strick-Apps)
const TIPS = [
  ['Gesundheit','Alle 20–30 Minuten kurz aufstehen, ein paar Schritte gehen und die Schultern locker kreisen lassen.'],
  ['Gesundheit','Die 20-20-20-Regel für die Augen: alle 20 Minuten 20 Sekunden lang in die Ferne schauen.'],
  ['Gesundheit','Ein Glas Wasser neben das Wollkörbchen stellen – beim Stricken vergisst man das Trinken leicht.'],
  ['Gesundheit','Faust machen, dann die Finger weit spreizen – 5× wiederholen. Das lockert die Hände.'],
  ['Gesundheit','Handgelenk dehnen: Arm ausstrecken, Handfläche nach vorn, Finger mit der anderen Hand sanft zurückziehen. Seiten wechseln.'],
  ['Gesundheit','Rücken gerade, Schultern runter, Ellbogen aufstützen – ein Kissen auf dem Schoß hebt die Arbeit an und entlastet den Nacken.'],
  ['Gesundheit','Faden locker führen: Ein entspannter Griff schont Hände und Handgelenke und gibt ein gleichmäßigeres Maschenbild.'],
  ['Gesundheit','Rundstricknadeln statt langer gerader Nadeln: Das Gewicht liegt im Schoß statt auf den Handgelenken.'],
  ['Gesundheit','Holz- oder Bambusnadeln sind wärmer und rutschen weniger – angenehmer für empfindliche Hände.'],
  ['Gesundheit','Gutes Licht! Tageslicht oder eine helle Lampe von der Seite – besonders bei dunkler Wolle.'],
  ['Gesundheit','Tun die Hände weh, ist das ein Signal: Pause machen, eine Weile pausieren – und wenn es bleibt, ärztlich abklären lassen.'],
  ['Gesundheit','Mal die Projekte wechseln: dicke und dünne Nadeln abwechseln beansprucht die Hände unterschiedlich.'],
  ['Wohlfühlen','Studien aus Großbritannien und Schweden zeigen: Stricken beruhigt, gibt dem Tag Struktur und macht viele Menschen glücklicher.'],
  ['Wohlfühlen','Gleichmäßige rechte Maschen wirken fast wie Meditation – ideal zum Abschalten nach einem langen Tag.'],
  ['Wohlfühlen','Eine feste „Strickecke“ mit Lampe, Decke, Körbchen und Tee macht das Stricken zum kleinen Ritual.'],
  ['Wohlfühlen','Zwei Projekte parallel: eines zum Nachdenken (Muster) und eines zum Entspannen (glatt rechts) – für jede Stimmung das Richtige.'],
  ['Wohlfühlen','Hörbuch oder Lieblingsmusik dazu – einfache Muster und gute Geschichten passen wunderbar zusammen.'],
  ['Wohlfühlen','Mit Freundinnen stricken: In England heißt das „Knit & Natter“ – stricken und quatschen. Gibt es auch als Strickcafé in vielen Städten.'],
  ['Wohlfühlen','Fertige Teile fotografieren und festhalten – es tut gut zu sehen, was man alles geschafft hat.'],
  ['Technik','Immer eine Maschenprobe stricken – und vor dem Messen waschen. So passt der Pullover am Ende wirklich.'],
  ['Technik','Maschenmarkierer an jedem Mustersatz sparen viel Zählen und Aufribbeln.'],
  ['Technik','Rettungsleine (Lifeline): Zahnseide durch eine Reihe ziehen – geht etwas schief, ribbelt man nur bis dahin auf.'],
  ['Technik','Lockerer Anschlag: zwei Nadeln zusammen nehmen oder eine Nummer dicker.'],
  ['Technik','Abketten immer locker – lieber mit einer dickeren Nadel, sonst wird der Rand zu stramm.'],
  ['Technik','Neue Knäuel am Reihenanfang ansetzen – so verschwinden die Fäden später in der Naht.'],
  ['Technik','Ein Garn aus derselben Färbepartie kaufen – die Partienummer steht auf der Banderole.'],
  ['Technik','Banderole aufheben! Darauf stehen Pflegehinweise, Lauflänge und Partie – am besten im Projekt fotografieren.'],
  ['Technik','Fertige Teile spannen: anfeuchten, auf Maß feststecken, trocknen lassen. Wirkt Wunder, gerade bei Lochmustern.'],
  ['Technik','Bei Ärmeln und Socken beide gleichzeitig stricken (zwei Knäuel) – dann werden sie garantiert gleich lang.'],
  ['Technik','Die eigene Größe in der Anleitung mit Textmarker einkreisen, bevor es losgeht.'],
  ['Technik','Reihen zählen fällt leichter mit einem Zähler – der große Reihenzähler steckt in jedem Projekt hier in der App.'],
  ['Garn & Pflege','Wollsachen eher lüften als waschen – Wolle reinigt sich an der frischen Luft fast von selbst.'],
  ['Garn & Pflege','Wolle lauwarm mit Wollwaschmittel waschen, nicht reiben, in ein Handtuch rollen und liegend trocknen.'],
  ['Garn & Pflege','Gegen Motten: Zedernholz oder Lavendelsäckchen in den Wollvorrat, Vorrat ab und zu durchschauen.'],
  ['Garn & Pflege','Mulesingfreie Merinowolle oder RWS-Siegel wählen – das schont die Schafe.'],
  ['Garn & Pflege','Für Socken Garn mit etwas Polyamid oder Nylon nehmen – hält an Ferse und Spitze viel länger.'],
  ['Garn & Pflege','Baumwolle ist kühl und waschbar – ideal für Sommer-Tops, Spültücher und Babysachen.'],
  ['Garn & Pflege','Reste nach Garnstärke sortieren – dann findet man sie für Streifen- und Restprojekte schnell wieder.'],
  ['Lifestyle','„Hygge“ aus Dänemark: Kerzenlicht, Tee, eine weiche Decke und das Strickzeug – Gemütlichkeit als Lebensgefühl.'],
  ['Lifestyle','„Slow Fashion“: Ein selbstgestrickter Pullover hält oft Jahrzehnte – das Gegenteil von Wegwerfmode.'],
  ['Lifestyle','Schweden wählte 2022 handgestrickte Kleidung zum „Weihnachtsgeschenk des Jahres“.'],
  ['Lifestyle','Im Juni ist „World Wide Knit in Public Day“ – Strickende treffen sich zum gemeinsamen Stricken in Parks und Cafés.'],

/* ================= Strickzeit-Timer mit Pausen ================= */
let tStart = LS.get('tStart', null), tInt = LS.get('tInt', 30), tLastPause = LS.get('tLast', null);
function timerOn(){ return !!tStart; }
function timerToggle(){
  if (tStart){ tStart=null; tLastPause=null; toast('Strickzeit beendet – schön gemacht, Uschi!'); }
  else { tStart=Date.now(); tLastPause=Date.now(); toast(`Strickzeit läuft – ich erinnere dich alle ${tInt} Minuten an eine Pause.`); }
  LS.set('tStart',tStart); LS.set('tLast',tLastPause); drawTop(); if(cur()==='start') render();
}
function mins(ms){ return Math.floor(ms/60000); }
function drawTop(){
  const el=$('#topbar');
  if (timerOn()){
    const run=mins(Date.now()-tStart), next=Math.max(0,tInt-mins(Date.now()-tLastPause));
    el.innerHTML=`<span class="timer">⏱️ Strickzeit <b>${run} Min.</b> · nächste Pause in <b>${next} Min.</b></span><button class="tbtn" id="tstop">Beenden</button>`;
    $('#tstop').onclick=timerToggle;
  } else {
    const tp=TIPS[dayNo()%TIPS.length];
    el.innerHTML=`<span>🧶 <b>Tipp des Tages:</b> ${esc(tp[1])}</span>`;
  }
}
function showPause(){
  const p=PAUSEN[Math.floor(Math.random()*PAUSEN.length)];
  openOv(`<div class="pause"><div class="big">${p[0]}</div><div class="eyebrow o">Kleine Pause, Uschi</div><h2>${p[1]}</h2><p>${p[2]}</p>
    <p class="muted small">Du strickst jetzt seit ${mins(Date.now()-tStart)} Minuten.</p>
    <div class="row" style="justify-content:center"><button class="btn" id="pOk">Erledigt – weiterstricken</button><button class="btn ghost" id="pEnd">Strickzeit beenden</button></div></div>`);
  $('#pOk').onclick=()=>{ tLastPause=Date.now(); LS.set('tLast',tLastPause); closeOv(); drawTop(); };
  $('#pEnd').onclick=()=>{ closeOv(); timerToggle(); };
}
setInterval(()=>{
  if (!timerOn()) return;
  drawTop();
  if (Date.now()-tLastPause >= tInt*60000 && !$('#ov').innerHTML){ showPause(); }
}, 15000);

let DB=null, ASSETS=null, SAMPLE=null, UID='lokal';
let allDocs=[], gallery=[], dbState='laden';
const myProjects = () => allDocs.filter(d=>!d.kind || d.kind==='projekt');
const myStash = () => allDocs.filter(d=>d.kind==='garn' || d.kind==='nadel');
let IDB=null;
function idbOpen(){ return new Promise((res,rej)=>{ const r=indexedDB.open('maschenzeit',1);
  r.onupgradeneeded=()=>{ r.result.createObjectStore('docs',{keyPath:'id'}); }; r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
function idbTx(mode, fn){ return new Promise((res,rej)=>{ const tx=IDB.transaction('docs',mode); const st=tx.objectStore('docs'); const out=fn(st); tx.oncomplete=()=>res(out&&out.result!==undefined?out.result:undefined); tx.onerror=()=>rej(tx.error); }); }
async function reload(){ allDocs=(await idbTx('readonly',st=>st.getAll())||[]).sort((a,b)=>(b.updated||0)-(a.updated||0)); dbState='ok'; render(true); }
const localDoc = id => ({
  async set(body){ await idbTx('readwrite',st=>st.put({...body,id})); await reload(); },
  async update(part){ const cur=allDocs.find(d=>d.id===id)||{}; await idbTx('readwrite',st=>st.put({...cur,...part,id})); allDocs=allDocs.map(d=>d.id===id?{...d,...part}:d); },
  async delete(){ await idbTx('readwrite',st=>st.delete(id)); await reload(); },
});
const col = () => ({ doc: localDoc });

/* Sicherung: alles als Datei speichern / wiederherstellen */
async function backupSave(){
  const data={app:'maschenzeit',version:1,datum:new Date().toISOString(),docs:allDocs};
  const name='maschenzeit-sicherung-'+new Date().toISOString().slice(0,10)+'.json';
  const blob=new Blob([JSON.stringify(data)],{type:'application/json'});
  const file=new File([blob],name,{type:'application/json'});
  try{
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:name}); }
    else { const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000); }
    LS.set('lastBackup',Date.now()); toast('Sicherung erstellt ✓'); render();
  }catch(e){ if(e && e.name!=='AbortError') toast('Sicherung hat nicht geklappt'); }
}
async function backupLoad(file){
  try{
    const data=JSON.parse(await file.text());
    if(data.app!=='maschenzeit' || !Array.isArray(data.docs)) throw 0;
    await idbTx('readwrite',st=>{ data.docs.forEach(d=>d&&d.id&&st.put(d)); });
    await reload(); toast(`${data.docs.length} Einträge wiederhergestellt ✓`);
  }catch(e){ toast('Diese Datei ist keine maschenzeit-Sicherung'); }
}
function backupCard(){
  const last=LS.get('lastBackup',null), days=last?Math.floor((Date.now()-last)/864e5):null;
  return bcard('💾 Sicherung', `<div class="small">Deine Projekte und dein Vorrat liegen nur auf diesem Gerät. Speichere ab und zu eine Sicherung – am besten über „In Dateien sichern“ in den SharePoint-Ordner <b>maschenzeit Sicherungen</b>.</div>
    <p class="small"><b>Letzte Sicherung:</b> ${last?new Date(last).toLocaleDateString('de-DE')+(days>0?` (vor ${days} Tag${days===1?'':'en'})`:' (heute)'):'noch keine'}</p>
    <div class="row"><button class="btn" id="bkSave">Sicherung speichern</button><label class="btn sec" style="cursor:pointer">Sicherung laden<input type="file" accept=".json,application/json" id="bkLoad" style="display:none"></label></div>`);
}
function bindBackup(){
  $('#bkSave') && ($('#bkSave').onclick=backupSave);
  $('#bkLoad') && ($('#bkLoad').onchange=e=>{ const f=e.target.files[0]; if(f) backupLoad(f); e.target.value=''; });
}
function backupDue(){ const last=LS.get('lastBackup',null); return allDocs.length>0 && (!last || Date.now()-last>14*864e5); }

async function shrink(file, max){
  const url=URL.createObjectURL(file);
  const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; });
  const s=Math.min(1, max/Math.max(img.naturalWidth,img.naturalHeight));
  const c=document.createElement('canvas'); c.width=Math.round(img.naturalWidth*s); c.height=Math.round(img.naturalHeight*s);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url); return c;
}
async function addPhotos(files, arr, redraw){
  for (const f of files){
    try{
      toast('Foto wird vorbereitet …');
      if (ASSETS){ const c=await shrink(f,1600); const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.85)); const a=await ASSETS.upload(blob); arr.push({id:a.id}); }
      else { const c=await shrink(f,1400); arr.push({data:c.toDataURL('image/jpeg',.8)}); }
      redraw();
    }catch(err){ toast('Foto konnte nicht geladen werden'); }
  }
}

  th(); $('#s_th').onclick=e=>{ if(e.target.dataset.i!==undefined){ d.photos.splice(+e.target.dataset.i,1); th(); } };
  $('#x').onclick=closeOv;
  $('#s_file').onchange=async e=>{ await addPhotos(e.target.files, d.photos, th); e.target.value=''; };
  $('#s_save').onclick=async()=>{ F.forEach(f=>d[f[0]]=$('#s_'+f[0]).value.trim()); d.notes=$('#s_notes').value.trim(); d.updated=Date.now();

    try{ await col().doc(id).set(body); toast('Gespeichert ✓'); closeOv(); }catch(e){ toast('Speichern hat nicht geklappt'); } };

}

const num = id => { const v=parseFloat(String($(id).value).replace(',','.')); return isFinite(v)&&v>0?v:null; };
const fmt = (v,d=1) => v.toLocaleString('de-DE',{maximumFractionDigits:d});
AFTER.rechner = () => {
  const r1=()=>{ const am=num('#r_am'),mm=num('#r_mm'),ar=num('#r_ar'),mr=num('#r_mr'); const out=$('#r_out');
    if(!am||!mm){ out.innerHTML='<span class="muted small">Bitte beide Maschenproben eintragen.</span>'; return; }
    const f=mm/am, nums=($('#r_list').value.match(/\d+([.,]\d+)?/g)||[]).map(x=>parseFloat(x.replace(',','.')));
    let h=`<div>Faktor Maschen: <b>${fmt(f,3)}</b>${ar&&mr?` · Reihen: <b>${fmt(mr/ar,3)}</b>`:''}</div>`;
    if(nums.length) h+=`<table class="t" style="margin-top:8px"><tr><th>Anleitung</th><th>Maschen neu</th>${ar&&mr?'<th>Reihen neu</th>':''}</tr>${nums.map(n=>`<tr><td>${fmt(n)}</td><td class="result" style="font-size:1.2rem">${Math.round(n*f)}</td>${ar&&mr?`<td>${Math.round(n*mr/ar)}</td>`:''}</tr>`).join('')}</table>
      <div class="small muted">Gerundet. Bei Mustersätzen auf die nächste passende Zahl anpassen.</div>`;
    out.innerHTML=h; };
  ['#r_am','#r_mm','#r_ar','#r_mr','#r_list'].forEach(i=>$(i).addEventListener('input',r1)); r1();
  const r2=()=>{ const cm=num('#b_cm'),m=num('#b_m'),rap=num('#b_rap'); const rand=parseInt($('#b_rand').value)||0; const out=$('#b_out');
    if(!cm||!m){ out.innerHTML='<span class="muted small">Breite und Maschenprobe eintragen.</span>'; return; }
    const n=cm*m/10; let base=Math.round(n); if(rap) base=Math.max(rap,Math.round(n/rap)*rap);
    out.innerHTML=`<div class="result">${base+rand} Maschen</div><div class="small muted">${fmt(n)} M rechnerisch${rap?`, auf Mustersatz ${rap} gerundet`:''}${rand?` + ${rand} Randmaschen`:''} → ca. ${fmt(base/m*10)} cm</div>`; };
  ['#b_cm','#b_m','#b_rap','#b_rand'].forEach(i=>$(i).addEventListener('input',r2)); r2();
  const r3=()=>{ const n=num('#g_n'),m=num('#g_m'),mm=num('#g_mm'),p=num('#g_p'); const out=$('#g_out');
    if(!n||!m||!mm){ out.innerHTML='<span class="muted small">Knäuel und Lauflängen eintragen.</span>'; return; }
    const meter=n*m, k=Math.ceil(meter/mm);
    out.innerHTML=`<div class="result">${k} Knäuel</div><div class="small muted">Gesamt ${fmt(meter,0)} m${p?` · ca. ${fmt(k*p,2)} €`:''}. Tipp: 1 Knäuel Reserve aus derselben Partie kaufen.</div>`; };
  ['#g_n','#g_m','#g_mm','#g_p'].forEach(i=>$(i).addEventListener('input',r3)); r3();
  $('#r_ask').onclick=e=>{ const q=$('#r_q').value.trim(); if(!q) return toast('Bitte eine Frage eingeben'); askClaude('Frage zum Umrechnen beim Stricken: '+q+'\nRechne nachvollziehbar vor und runde auf ganze Maschen.', $('#r_ai'), e.target, q); };
};

  ${bcard('Warum Stricken guttut', `<p>Eine große britische Umfrage unter über 3.500 Strickenden (Riley, Corkhill & Morris, 2013) zeigte: Wer häufig strickt, fühlt sich ruhiger und glücklicher. Eine Studie der Universität Göteborg beschreibt, dass Stricken beruhigt, dem Alltag Struktur gibt und zur eigenen Identität gehört.</p>
    <p class="small muted">Wichtig dabei: Pausen machen, Hände lockern, aufstehen – dafür gibt es auf der Startseite die „Strickzeit“ mit Pausen-Erinnerung.</p>`)}`;
AFTER.welt = () => { document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{ suchQ=b.dataset.q; suchTags.clear(); location.hash='anleitungen'; }); };

/* ---- Wolle ---- */
let wq='';
VIEW.wolle = () => `<h1>Wolle kaufen – mit Lieferung</h1>
  <div class="card"><label class="f" for="w_q">Welche Wolle suchst du?</label>
    <input class="i" id="w_q" value="${esc(wq)}" placeholder="z. B. Sockenwolle 4-fach, Merino mulesingfrei, Alpaka">
    <div class="chips" id="w_c">${['Sockenwolle','Merino mulesingfrei','Bio-Baumwolle','Alpaka','Recycling-Garn','Restposten Wolle'].map(x=>`<span class="chip" data-v="${x}">${x}</span>`).join('')}</div>
    <div id="w_links"></div></div>
  <h2>Empfohlene Shops</h2>
  <div class="grid2">${SHOPS.map(s=>`<a class="link" href="${s.u}" target="_blank" rel="noopener"><span class="em">${s.t[0]==='unser Shop'?'🏠':'🧶'}</span><span><b>${s.n}</b><span class="small">${s.d}</span><br>${s.t.map(t=>`<span class="tag ${t==='nachhaltig'?'':t==='unser Shop'?'o':'b'}">${t}</span>`).join('')}</span></a>`).join('')}</div>
  <br>${bcard('Woran erkenne ich nachhaltige Wolle?', `<table class="t">${SIEGEL.map(s=>`<tr><th style="width:130px">${s[0]}</th><td>${s[1]}</td></tr>`).join('')}</table>
  <p class="small muted">Spartipps: Restposten und Auslaufgarne, DROPS-Rabattwochen, Set-Preise für einen ganzen Pullover. Erst im <a href="#vorrat">Vorrat</a> nachsehen, dann kaufen.</p>`)}`;
function drawW(){ const q=$('#w_q').value.trim(); wq=q; const el=$('#w_links');
  if(!q){ el.innerHTML=''; return; }
  const L=[['🔍 Preisvergleich (Google Shopping)',`https://www.google.com/search?tbm=shop&q=${enc(q+' wolle')}`],
    ['💶 Günstigster Preis (idealo)',`https://www.idealo.de/preisvergleich/MainSearchProductCategory.html?q=${enc(q+' wolle')}`],
    ['🌱 Bei Soul Wool (nachhaltig)',`https://www.google.com/search?q=${enc('site:soul-wool.com '+q)}`],
    ['🧶 Bei Wollplatz',`https://www.google.com/search?q=${enc('site:wollplatz.de '+q)}`]];
  el.innerHTML=`<div class="grid2" style="margin-top:10px">${L.map(l=>`<a class="link" href="${l[1]}" target="_blank" rel="noopener"><span><b>${l[0]}</b><span class="small">„${esc(q)}“</span></span></a>`).join('')}</div>`; }
AFTER.wolle = () => { $('#w_q').addEventListener('input',drawW); $('#w_c').onclick=e=>{ if(e.target.dataset.v){ $('#w_q').value=e.target.dataset.v; drawW(); } }; drawW(); };

/* ---- Upcycling ---- */
VIEW.upcycling = () => `<h1>Upcycling & DIY</h1>
  <p class="muted">Was man hat, optimal nutzen – statt immer neu zu kaufen.</p>
  ${bcard('♻️ Was kann ich daraus machen?', `<textarea class="i" id="u_q" placeholder="z. B. 3 alte Wollpullover (einer verfilzt), ein Rest Sockenwolle in Blau und Grau, ein altes Jeanshemd …"></textarea>
    <div class="row" style="margin-top:8px"><button class="btn" id="u_ask">Ideen suchen</button>
      <a class="btn sec" id="u_pin" target="_blank" rel="noopener" href="https://de.pinterest.com/search/pins/?q=upcycling%20wolle">📌 Pinterest</a></div>
    <div id="u_ai"></div>`)}
  <div class="grid2">${UPCYCLE.map(([e,t,b])=>`<div class="card" style="margin:0"><div class="split" style="grid-template-columns:72px 1fr"><div class="oval" style="font-size:2rem">${e}</div><div><h3>${t}</h3><div class="small">${b}</div>
    <a class="go" target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=${enc(t+' upcycling anleitung')}">▶️ Video-Anleitungen →</a></div></div></div>`).join('')}</div>`;
AFTER.upcycling = () => {
  $('#u_q').addEventListener('input',()=>{ $('#u_pin').href='https://de.pinterest.com/search/pins/?q='+enc(($('#u_q').value.trim()||'wolle')+' upcycling'); });
  $('#u_ask').onclick=e=>{ const q=$('#u_q').value.trim(); if(!q) return toast('Bitte beschreiben, was du hast'); askClaude('Ich habe folgende Dinge/Reste: '+q+'\nSchlage 4 praktische Upcycling- oder Strick-/Häkelideen vor, je mit kurzer Anleitung in 2–3 Schritten und Schwierigkeit.', $('#u_ai'), e.target, q+' upcycling'); };
};

render();
initCaps();
setTimeout(()=>{ if(dbState==='laden' && !DB){ dbState='aus'; render(true); } }, 11000);
</script>
</body>
</html>
